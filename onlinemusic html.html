<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>Enaiat Music App</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    -webkit-tap-highlight-color:transparent;
}

:root{
    --pink:#ff3b91;
    --pink2:#ff78b8;
    --purple:#824cff;
    --blue:#4f7cff;
    --dark:#05040b;
    --glass:rgba(255,255,255,.07);
}

body{
    min-height:100vh;
    color:white;
    font-family:Inter,Arial,sans-serif;
    background:
        radial-gradient(circle at 20% 10%,rgba(255,30,130,.18),transparent 30%),
        radial-gradient(circle at 90% 25%,rgba(110,55,255,.18),transparent 32%),
        radial-gradient(circle at 50% 100%,rgba(255,20,110,.14),transparent 35%),
        #05040b;
    overflow-x:hidden;
}

/* BACKGROUND */

body:before{
    content:"";
    position:fixed;
    inset:0;
    pointer-events:none;
    background:
        radial-gradient(circle at 50% 40%,
        rgba(255,60,150,.05),
        transparent 40%);
}

.stars{
    position:fixed;
    inset:0;
    pointer-events:none;
    z-index:-1;
}

.star{
    position:absolute;
    width:2px;
    height:2px;
    background:white;
    border-radius:50%;
    opacity:.4;
    animation:twinkle 3s infinite alternate;
}

@keyframes twinkle{
    from{opacity:.15}
    to{opacity:.8}
}

/* APP */

.app{
    width:min(720px,100%);
    margin:auto;
    padding:22px 16px 150px;
}

/* HEADER */

header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:25px;
}

.brand{
    display:flex;
    align-items:center;
    gap:12px;
}

.brand-icon{
    width:48px;
    height:48px;
    border-radius:16px;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:25px;
    background:linear-gradient(135deg,var(--pink),var(--purple));
    box-shadow:
        0 10px 35px rgba(255,40,140,.35);
}

.brand h1{
    font-size:20px;
    font-weight:800;
}

.brand p{
    color:#85818e;
    font-size:10px;
    margin-top:4px;
}

.header-button{
    width:45px;
    height:45px;
    border:1px solid rgba(255,255,255,.1);
    background:var(--glass);
    color:white;
    border-radius:50%;
    cursor:pointer;
    font-size:18px;
}

/* PLAYER */

.player{
    position:relative;
    overflow:hidden;
    padding:32px 20px 25px;
    border-radius:38px;
    border:1px solid rgba(255,255,255,.11);
    background:
        linear-gradient(
            145deg,
            rgba(255,255,255,.095),
            rgba(255,255,255,.025)
        );
    backdrop-filter:blur(30px);
    box-shadow:
        0 35px 100px rgba(0,0,0,.55),
        inset 0 1px rgba(255,255,255,.08);
    text-align:center;
}

.player:before{
    content:"";
    position:absolute;
    width:300px;
    height:300px;
    border-radius:50%;
    background:var(--pink);
    filter:blur(120px);
    opacity:.12;
    top:-180px;
    left:50%;
    transform:translateX(-50%);
}

/* CD */

.cd-area{
    width:300px;
    height:300px;
    margin:0 auto 28px;
    position:relative;
    display:flex;
    justify-content:center;
    align-items:center;
}

.cd{
    width:285px;
    height:285px;
    border-radius:50%;
    position:relative;

    background:
        repeating-radial-gradient(
            circle,
            rgba(255,255,255,.08) 0px,
            rgba(255,255,255,.08) 1px,
            transparent 2px,
            transparent 5px
        ),
        conic-gradient(
            #191927,
            #754bff,
            #ff3d91,
            #262644,
            #ff78b8,
            #5536b8,
            #191927
        );

    box-shadow:
        0 25px 65px rgba(0,0,0,.7),
        0 0 45px rgba(255,60,150,.18),
        inset 0 0 35px rgba(255,255,255,.1);

    transition:.5s;
}

.cd:before{
    content:"";
    position:absolute;
    inset:16px;
    border-radius:50%;
    border:1px solid rgba(255,255,255,.2);
}

.cd:after{
    content:"";
    position:absolute;
    inset:0;
    border-radius:50%;
    background:
        linear-gradient(
            125deg,
            transparent 35%,
            rgba(255,255,255,.28) 48%,
            transparent 55%
        );
    opacity:.55;
}

/* CD LABEL */

.cd-label{
    position:absolute;
    width:128px;
    height:128px;
    border-radius:50%;
    left:50%;
    top:50%;
    transform:translate(-50%,-50%);

    background:
        radial-gradient(
            circle at 35% 30%,
            #ff9bca,
            #ff3b91 35%,
            #7c45ff 100%
        );

    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;

    box-shadow:
        0 0 25px rgba(255,50,145,.35),
        inset 0 0 20px rgba(255,255,255,.18);

    z-index:2;
}

.cd-label-title{
    font-size:15px;
    font-weight:800;
    letter-spacing:1px;
}

.cd-label-created{
    font-size:7px;
    letter-spacing:1.5px;
    margin-top:7px;
    opacity:.8;
    text-transform:uppercase;
}

.cd-hole{
    position:absolute;
    width:19px;
    height:19px;
    background:#090812;
    border:3px solid rgba(255,255,255,.5);
    border-radius:50%;
    z-index:5;
}

.cd.playing{
    animation:spin 5s linear infinite;
}

@keyframes spin{
    to{
        transform:rotate(360deg);
    }
}

/* CD LIGHT */

.cd-light{
    position:absolute;
    width:340px;
    height:340px;
    border-radius:50%;
    border:1px solid rgba(255,80,170,.12);
    animation:pulse 2.5s ease-in-out infinite;
}

@keyframes pulse{
    0%,100%{
        transform:scale(.96);
        opacity:.4;
    }
    50%{
        transform:scale(1.04);
        opacity:.9;
    }
}

/* SONG */

.song-title{
    font-size:24px;
    font-weight:800;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
    margin-bottom:7px;
}

.artist{
    color:#9994a6;
    font-size:13px;
}

/* VISUALIZER */

.visualizer{
    height:38px;
    display:flex;
    justify-content:center;
    align-items:center;
    gap:4px;
    margin:15px 0 4px;
}

.visualizer span{
    width:4px;
    height:7px;
    border-radius:10px;
    background:linear-gradient(var(--pink),var(--purple));
}

.visualizer.playing span{
    animation:bars .7s ease-in-out infinite alternate;
}

.visualizer span:nth-child(2){animation-delay:.1s}
.visualizer span:nth-child(3){animation-delay:.2s}
.visualizer span:nth-child(4){animation-delay:.3s}
.visualizer span:nth-child(5){animation-delay:.15s}
.visualizer span:nth-child(6){animation-delay:.25s}
.visualizer span:nth-child(7){animation-delay:.35s}

@keyframes bars{
    from{height:5px}
    to{height:32px}
}

/* PROGRESS */

.progress{
    width:100%;
    height:5px;
    appearance:none;
    background:rgba(255,255,255,.12);
    border-radius:10px;
}

.progress::-webkit-slider-thumb{
    appearance:none;
    width:14px;
    height:14px;
    border-radius:50%;
    background:white;
    box-shadow:0 0 15px var(--pink);
}

.time{
    display:flex;
    justify-content:space-between;
    color:#777383;
    font-size:10px;
    margin-top:7px;
}

/* CONTROLS */

.controls{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:24px;
    margin:22px 0;
}

.control{
    border:none;
    background:none;
    color:white;
    cursor:pointer;
    font-size:20px;
}

.control.small{
    color:#898494;
    font-size:17px;
}

.control.active{
    color:var(--pink2);
}

.play{
    width:67px;
    height:67px;
    border-radius:50%;
    background:
        linear-gradient(
            135deg,
            var(--pink),
            var(--purple)
        );
    box-shadow:
        0 12px 40px rgba(255,50,145,.42);
    font-size:25px;
}

/* VOLUME */

.volume-row{
    display:flex;
    align-items:center;
    gap:10px;
    color:#85818e;
}

.volume{
    flex:1;
    appearance:none;
    height:4px;
    background:rgba(255,255,255,.12);
    border-radius:10px;
}

.volume::-webkit-slider-thumb{
    appearance:none;
    width:12px;
    height:12px;
    background:white;
    border-radius:50%;
}

/* SEARCH */

.search-area{
    margin-top:28px;
}

.search{
    width:100%;
    height:50px;
    border-radius:18px;
    border:1px solid rgba(255,255,255,.09);
    background:rgba(255,255,255,.055);
    color:white;
    outline:none;
    padding:0 18px;
    font-size:13px;
}

.search::placeholder{
    color:#706c7b;
}

/* ADD */

.add{
    margin-top:12px;
    width:100%;
    min-height:75px;
    border:1px dashed rgba(255,80,155,.35);
    border-radius:22px;
    background:rgba(255,55,140,.045);
    display:flex;
    justify-content:center;
    align-items:center;
    gap:12px;
    cursor:pointer;
}

.add-icon{
    width:38px;
    height:38px;
    border-radius:50%;
    display:flex;
    justify-content:center;
    align-items:center;
    background:linear-gradient(135deg,var(--pink),var(--purple));
    font-size:20px;
}

.add strong{
    font-size:13px;
}

.add small{
    color:#777383;
    font-size:10px;
}

/* PLAYLIST */

.playlist{
    margin-top:28px;
}

.playlist-head{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:14px;
}

.playlist-head h2{
    font-size:17px;
}

.clear{
    border:none;
    background:none;
    color:var(--pink2);
    cursor:pointer;
}

.song{
    display:flex;
    align-items:center;
    gap:12px;
    padding:10px;
    border-radius:18px;
    margin-bottom:8px;
    background:rgba(255,255,255,.045);
    border:1px solid rgba(255,255,255,.05);
    cursor:pointer;
    transition:.25s;
}

.song:hover{
    background:rgba(255,255,255,.08);
}

.song.active{
    background:rgba(255,55,140,.09);
    border-color:rgba(255,70,150,.25);
}

.song-number{
    width:25px;
    text-align:center;
    color:#696573;
    font-size:10px;
}

.song-icon{
    width:45px;
    height:45px;
    border-radius:13px;
    display:flex;
    justify-content:center;
    align-items:center;
    background:linear-gradient(135deg,#29213e,#171321);
    font-size:19px;
}

.song-info{
    min-width:0;
    flex:1;
}

.song-name{
    font-size:13px;
    font-weight:600;
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
}

.song-meta{
    color:#777383;
    font-size:9px;
    margin-top:5px;
}

.favorite{
    border:none;
    background:none;
    color:#666270;
    font-size:18px;
    cursor:pointer;
}

.favorite.liked{
    color:#ff4b98;
}

/* EMPTY */

.empty{
    text-align:center;
    padding:35px;
    color:#6f6b79;
}

.empty div{
    font-size:38px;
    margin-bottom:10px;
}

/* MINI */

.mini{
    position:fixed;
    z-index:100;
    bottom:13px;
    left:50%;
    transform:translateX(-50%);
    width:min(680px,calc(100% - 22px));
    display:flex;
    align-items:center;
    gap:10px;
    padding:10px;
    border:1px solid rgba(255,255,255,.12);
    border-radius:22px;
    background:rgba(12,10,20,.9);
    backdrop-filter:blur(25px);
    box-shadow:0 15px 50px rgba(0,0,0,.6);
}

.mini-info{
    flex:1;
    min-width:0;
}

.mini-name{
    font-size:12px;
    font-weight:700;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

.mini-status{
    color:#777383;
    font-size:9px;
    margin-top:4px;
}

.mini-play{
    width:43px;
    height:43px;
    border-radius:50%;
    border:none;
    background:linear-gradient(135deg,var(--pink),var(--purple));
    color:white;
    cursor:pointer;
}

/* FLOATING NOTES */

.note{
    position:fixed;
    bottom:-30px;
    z-index:80;
    pointer-events:none;
    animation:rise 4s linear forwards;
}

@keyframes rise{
    0%{
        transform:translateY(0) rotate(0) scale(.6);
        opacity:0;
    }
    15%{
        opacity:1;
    }
    100%{
        transform:translateY(-110vh) rotate(35deg) scale(1.4);
        opacity:0;
    }
}

/* TOAST */

.toast{
    position:fixed;
    top:18px;
    left:50%;
    transform:translate(-50%,-120px);
    background:rgba(25,21,35,.95);
    border:1px solid rgba(255,255,255,.1);
    padding:12px 18px;
    border-radius:30px;
    font-size:12px;
    z-index:500;
    transition:.4s;
}

.toast.show{
    transform:translate(-50%,0);
}

input[type=file]{
    display:none;
}

/* MOBILE */

@media(max-width:430px){

    .cd-area{
        width:260px;
        height:260px;
    }

    .cd{
        width:245px;
        height:245px;
    }

    .cd-label{
        width:112px;
        height:112px;
    }

    .cd-light{
        width:290px;
        height:290px;
    }

    .controls{
        gap:18px;
    }

    .play{
        width:61px;
        height:61px;
    }
}
</style>
</head>

<body>

<div class="stars" id="stars"></div>

<div class="toast" id="toast"></div>

<input
    type="file"
    id="fileInput"
    accept="audio/*"
    multiple
>

<main class="app">

<header>

    <div class="brand">

        <div class="brand-icon">
            🎵
        </div>

        <div>
            <h1>Enaiat Music</h1>
            <p>Music made with memories ❤️</p>
        </div>

    </div>

    <button
        class="header-button"
        id="shuffleTop">
        🔀
    </button>

</header>


<section class="player">

    <!-- CD -->

    <div class="cd-area">

        <div class="cd-light"></div>

        <div class="cd" id="cd">

            <div class="cd-label">

                <div class="cd-label-title">
                    ENAIAT
                </div>

                <div class="cd-label-created">
                    Created by Enaiat
                </div>

            </div>

            <div class="cd-hole"></div>

        </div>

    </div>


    <div
        class="song-title"
        id="songTitle">
        Welcome to Enaiat Music
    </div>

    <div
        class="artist"
        id="artist">
        Add your favorite songs ❤️
    </div>


    <!-- VISUALIZER -->

    <div
        class="visualizer"
        id="visualizer">

        <span></span>
        <span></span>
        <span></span>
        <span></span>
        <span></span>
        <span></span>
        <span></span>

    </div>


    <!-- PROGRESS -->

    <input
        type="range"
        class="progress"
        id="progress"
        min="0"
        max="100"
        value="0"
    >

    <div class="time">

        <span id="currentTime">
            0:00
        </span>

        <span id="duration">
            0:00
        </span>

    </div>


    <!-- CONTROLS -->

    <div class="controls">

        <button
            class="control small"
            id="shuffle">
            🔀
        </button>

        <button
            class="control"
            id="previous">
            ⏮
        </button>

        <button
            class="control play"
            id="play">
            ▶
        </button>

        <button
            class="control"
            id="next">
            ⏭
        </button>

        <button
            class="control small"
            id="repeat">
            🔁
        </button>

    </div>


    <!-- VOLUME -->

    <div class="volume-row">

        <span id="volumeIcon">
            🔊
        </span>

        <input
            class="volume"
            id="volume"
            type="range"
            min="0"
            max="1"
            step=".01"
            value=".8"
        >

    </div>

</section>


<!-- SEARCH / ADD -->

<section class="search-area">

    <input
        class="search"
        id="search"
        type="search"
        placeholder="🔎  Search your music..."
    >

    <label
        class="add"
        for="fileInput">

        <div class="add-icon">
            ＋
        </div>

        <div>
            <strong>
                Add Music From Your Phone
            </strong>

            <br>

            <small>
                Select one or many songs
            </small>
        </div>

    </label>

</section>


<!-- PLAYLIST -->

<section class="playlist">

    <div class="playlist-head">

        <h2>
            🎧 Your Music
        </h2>

        <button
            class="clear"
            id="clear">
            Clear
        </button>

    </div>

    <div id="songList">

        <div class="empty">

            <div>
                💿
            </div>

            Add your first song

        </div>

    </div>

</section>

</main>


<!-- MINI PLAYER -->

<div class="mini">

    <div style="
        width:43px;
        height:43px;
        border-radius:50%;
        background:linear-gradient(135deg,#ff3b91,#824cff);
        display:flex;
        align-items:center;
        justify-content:center;
        font-size:18px;">
        💿
    </div>

    <div class="mini-info">

        <div
            class="mini-name"
            id="miniName">
            Enaiat Music
        </div>

        <div
            class="mini-status"
            id="miniStatus">
            Ready to play
        </div>

    </div>

    <button
        class="mini-play"
        id="miniPlay">
        ▶
    </button>

</div>


<audio id="audio"></audio>


<script>

/* =====================================================
   ENAIAT MUSIC
===================================================== */

const audio =
    document.getElementById("audio");

const fileInput =
    document.getElementById("fileInput");

const playButton =
    document.getElementById("play");

const miniPlay =
    document.getElementById("miniPlay");

const previous =
    document.getElementById("previous");

const next =
    document.getElementById("next");

const shuffle =
    document.getElementById("shuffle");

const shuffleTop =
    document.getElementById("shuffleTop");

const repeat =
    document.getElementById("repeat");

const progress =
    document.getElementById("progress");

const volume =
    document.getElementById("volume");

const songTitle =
    document.getElementById("songTitle");

const artist =
    document.getElementById("artist");

const currentTime =
    document.getElementById("currentTime");

const duration =
    document.getElementById("duration");

const songList =
    document.getElementById("songList");

const search =
    document.getElementById("search");

const cd =
    document.getElementById("cd");

const visualizer =
    document.getElementById("visualizer");

const miniName =
    document.getElementById("miniName");

const miniStatus =
    document.getElementById("miniStatus");

const clear =
    document.getElementById("clear");

const toast =
    document.getElementById("toast");


let songs = [];
let current = -1;

let shuffleMode = false;
let repeatMode = false;

let urls = {};

audio.volume = .8;


/* =====================================================
   STARS
===================================================== */

const stars =
    document.getElementById("stars");

for(let i=0;i<100;i++){

    const star =
        document.createElement("div");

    star.className = "star";

    star.style.left =
        Math.random()*100+"%";

    star.style.top =
        Math.random()*100+"%";

    star.style.animationDelay =
        Math.random()*3+"s";

    stars.appendChild(star);
}


/* =====================================================
   TOAST
===================================================== */

function showToast(text){

    toast.textContent = text;

    toast.classList.add("show");

    setTimeout(()=>{
        toast.classList.remove("show");
    },2200);
}


/* =====================================================
   TIME
===================================================== */

function timeFormat(seconds){

    if(!Number.isFinite(seconds))
        return "0:00";

    const m =
        Math.floor(seconds/60);

    const s =
        Math.floor(seconds%60)
        .toString()
        .padStart(2,"0");

    return m+":"+s;
}


/* =====================================================
   NAME
===================================================== */

function cleanName(name){

    return name
        .replace(/\.[^/.]+$/,"")
        .replace(/[_-]/g," ")
        .trim();

}


/* =====================================================
   ADD SONGS
===================================================== */

fileInput.addEventListener(
    "change",
    function(){

        const files =
            Array.from(this.files);

        if(!files.length)
            return;

        files.forEach(file=>{

            if(!file.type.startsWith("audio/"))
                return;

            const id =
                Date.now()+Math.random();

            urls[id] =
                URL.createObjectURL(file);

            songs.push({

                id:id,

                name:
                    cleanName(file.name),

                url:
                    urls[id],

                favorite:false

            });

        });

        render();

        showToast(
            "Music added to Enaiat Music ❤️"
        );

        if(current===-1)
            load(0);

        this.value="";

    }
);


/* =====================================================
   LOAD
===================================================== */

function load(index){

    if(!songs.length)
        return;

    if(index<0)
        index=songs.length-1;

    if(index>=songs.length)
        index=0;

    current=index;

    const song =
        songs[current];

    audio.src =
        song.url;

    songTitle.textContent =
        song.name;

    artist.textContent =
        "Created by Enaiat ❤️";

    miniName.textContent =
        song.name;

    miniStatus.textContent =
        "Ready to play";

    progress.value=0;

    currentTime.textContent="0:00";

    duration.textContent="0:00";

    render();

}


/* =====================================================
   PLAY
===================================================== */

async function togglePlay(){

    if(!songs.length){

        showToast(
            "Add music first 🎵"
        );

        return;
    }

    if(current===-1)
        load(0);

    if(audio.paused){

        try{
            await audio.play();
        }catch(e){

            showToast(
                "Tap play again 🎵"
            );

        }

    }else{

        audio.pause();

    }

}


/* =====================================================
   PLAY EVENT
===================================================== */

audio.addEventListener(
    "play",
    ()=>{

        playButton.textContent="⏸";
        miniPlay.textContent="⏸";

        cd.classList.add("playing");

        visualizer.classList.add("playing");

        miniStatus.textContent=
            "Playing now";

        startNotes();

        render();

    }
);


/* =====================================================
   PAUSE
===================================================== */

audio.addEventListener(
    "pause",
    ()=>{

        playButton.textContent="▶";
        miniPlay.textContent="▶";

        cd.classList.remove("playing");

        visualizer.classList.remove(
            "playing"
        );

        miniStatus.textContent="Paused";

        clearInterval(noteTimer);

    }
);


/* =====================================================
   TIME UPDATE
===================================================== */

audio.addEventListener(
    "timeupdate",
    ()=>{

        if(!audio.duration)
            return;

        progress.value =
            audio.currentTime /
            audio.duration * 100;

        currentTime.textContent =
            timeFormat(
                audio.currentTime
            );

        duration.textContent =
            timeFormat(
                audio.duration
            );

    }
);


/* =====================================================
   SEEK
===================================================== */

progress.addEventListener(
    "input",
    ()=>{

        if(!audio.duration)
            return;

        audio.currentTime =
            progress.value/100 *
            audio.duration;

    }
);


/* =====================================================
   VOLUME
===================================================== */

volume.addEventListener(
    "input",
    ()=>{

        audio.volume =
            volume.value;

        const icon =
            document.getElementById(
                "volumeIcon"
            );

        if(audio.volume===0)
            icon.textContent="🔇";

        else if(audio.volume<.5)
            icon.textContent="🔉";

        else
            icon.textContent="🔊";

    }
);


/* =====================================================
   NEXT
===================================================== */

function nextSong(){

    if(!songs.length)
        return;

    let nextIndex;

    if(shuffleMode){

        if(songs.length===1){

            nextIndex=current;

        }else{

            do{

                nextIndex =
                    Math.floor(
                        Math.random()*
                        songs.length
                    );

            }while(
                nextIndex===current
            );

        }

    }else{

        nextIndex=current+1;

        if(nextIndex>=songs.length)
            nextIndex=0;

    }

    load(nextIndex);

    audio.play();

}


/* =====================================================
   PREVIOUS
===================================================== */

function previousSong(){

    if(!songs.length)
        return;

    let index=current-1;

    if(index<0)
        index=songs.length-1;

    load(index);

    audio.play();

}


/* =====================================================
   ENDED
===================================================== */

audio.addEventListener(
    "ended",
    ()=>{

        if(repeatMode){

            audio.currentTime=0;

            audio.play();

        }else{

            nextSong();

        }

    }
);


/* =====================================================
   BUTTONS
===================================================== */

playButton.onclick =
    togglePlay;

miniPlay.onclick =
    togglePlay;

next.onclick =
    nextSong;

previous.onclick =
    previousSong;


/* =====================================================
   SHUFFLE
===================================================== */

function toggleShuffle(){

    shuffleMode =
        !shuffleMode;

    shuffle.classList.toggle(
        "active",
        shuffleMode
    );

    shuffleTop.classList.toggle(
        "active",
        shuffleMode
    );

    showToast(
        shuffleMode
        ? "Shuffle ON 🔀"
        : "Shuffle OFF"
    );

}

shuffle.onclick =
    toggleShuffle;

shuffleTop.onclick =
    toggleShuffle;


/* =====================================================
   REPEAT
===================================================== */

repeat.onclick =
    ()=>{

        repeatMode =
            !repeatMode;

        repeat.classList.toggle(
            "active",
            repeatMode
        );

        showToast(
            repeatMode
            ? "Repeat ON 🔁"
            : "Repeat OFF"
        );

    };


/* =====================================================
   RENDER
===================================================== */

function render(){

    const query =
        search.value
        .toLowerCase()
        .trim();

    const filtered =
        songs.filter(
            song =>
            song.name
            .toLowerCase()
            .includes(query)
        );

    if(!filtered.length){

        songList.innerHTML=`

            <div class="empty">

                <div>💿</div>

                ${
                    songs.length
                    ? "No music found"
                    : "Add your first song"
                }

            </div>

        `;

        return;
    }

    songList.innerHTML="";

    filtered.forEach(
        (song,index)=>{

            const realIndex =
                songs.indexOf(song);

            const row =
                document.createElement(
                    "div"
                );

            row.className =
                "song "+
                (
                    realIndex===current
                    ? "active"
                    : ""
                );

            row.innerHTML=`

                <div class="song-number">
                    ${
                        realIndex===current &&
                        !audio.paused
                        ? "▶"
                        : realIndex+1
                    }
                </div>

                <div class="song-icon">
                    💿
                </div>

                <div class="song-info">

                    <div class="song-name">
                        ${escapeHTML(song.name)}
                    </div>

                    <div class="song-meta">
                        ${
                            realIndex===current &&
                            !audio.paused
                            ? "Playing now"
                            : "Enaiat Music"
                        }
                    </div>

                </div>

                <button
                    class="favorite ${
                        song.favorite
                        ? "liked"
                        : ""
                    }">

                    ${
                        song.favorite
                        ? "♥"
                        : "♡"
                    }

                </button>
            `;


            row.onclick =
                ()=>{
                    load(realIndex);
                    audio.play();
                };


            row.querySelector(
                ".favorite"
            ).onclick =
                event=>{

                    event.stopPropagation();

                    song.favorite =
                        !song.favorite;

                    render();

                };


            songList.appendChild(row);

        }
    );

}


/* =====================================================
   ESCAPE
===================================================== */

function escapeHTML(text){

    return text
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");

}


/* =====================================================
   SEARCH
===================================================== */

search.addEventListener(
    "input",
    render
);


/* =====================================================
   CLEAR
===================================================== */

clear.onclick =
    ()=>{

        if(!songs.length)
            return;

        if(
            !confirm(
                "Remove all songs?"
            )
        )
            return;

        audio.pause();

        Object.values(urls)
            .forEach(
                url =>
                URL.revokeObjectURL(url)
            );

        urls={};

        songs=[];

        current=-1;

        audio.removeAttribute(
            "src"
        );

        songTitle.textContent =
            "Welcome to Enaiat Music";

        artist.textContent =
            "Add your favorite songs ❤️";

        miniName.textContent =
            "Enaiat Music";

        miniStatus.textContent =
            "Ready to play";

        render();

        showToast(
            "Playlist cleared"
        );

    };


/* =====================================================
   FLOATING NOTES
===================================================== */

let noteTimer;

const noteSymbols=[
    "♪",
    "♫",
    "♬",
    "🎵",
    "🎶",
    "❤️",
    "✨"
];

function createNote(){

    if(audio.paused)
        return;

    const note =
        document.createElement(
            "div"
        );

    note.className="note";

    note.textContent =
        noteSymbols[
            Math.floor(
                Math.random()*
                noteSymbols.length
            )
        ];

    note.style.left =
        Math.random()*95+"vw";

    note.style.color =
        Math.random()>.5
        ? "#ff5b9f"
        : "#9970ff";

    note.style.fontSize =
        14+
        Math.random()*18+
        "px";

    document.body.appendChild(
        note
    );

    setTimeout(
        ()=>{
            note.remove();
        },
        4000
    );

}

function startNotes(){

    clearInterval(noteTimer);

    noteTimer =
        setInterval(
            createNote,
            600
        );

}


/* =====================================================
   START
===================================================== */

render();

</script>

</body>
</html>
